<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arn4v</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            user-select: none;
            cursor: none; /* Custom particle cursor */
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            color: #ffffff;
        }

        /* Particle Cursor Canvas */
        #cursorCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 99999;
        }

        /* Click to Enter Screen Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s ease;
        }

        .overlay p {
            font-size: 1.05rem;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 300;
            animation: pulseText 2s infinite ease-in-out;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.3; transform: scale(0.97); }
            50% { opacity: 1; transform: scale(1.03); }
        }

        .overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Fullscreen Video Background */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            overflow: hidden;
            background: #000;
        }

        .bg-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            filter: brightness(0.75) contrast(1.05);
        }

        /* Top Controls */
        .top-left-controls {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
        }

        .top-right-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: white;
            height: 42px;
            padding: 0 16px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .icon-btn-square {
            width: 42px;
            padding: 0;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.25);
        }

        /* Bottom-Left View Counter */
        .view-counter {
            position: fixed;
            bottom: 25px;
            left: 25px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.9);
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 8px 16px;
            border-radius: 12px;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            animation: floatSlow 4s ease-in-out infinite alternate;
        }

        /* Main Profile Content Wrapper */
        .main-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .main-wrapper.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Animated Profile Avatar Ring */
        .avatar-wrap {
            position: relative;
            width: 110px;
            height: 110px;
            margin-bottom: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .avatar-deco-ring {
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #ff007f, #7928ca, #00dfd8, #ff007f);
            animation: spinRing 3s linear infinite, glowPulse 2s ease-in-out infinite alternate;
            filter: blur(4px);
            opacity: 0.9;
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes glowPulse {
            0% { filter: blur(3px) brightness(1); }
            100% { filter: blur(7px) brightness(1.4); }
        }

        .avatar {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.9);
            z-index: 2;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            transition: transform 0.4s ease;
        }

        .avatar-wrap:hover .avatar {
            transform: scale(1.05) rotate(2deg);
        }

        /* Username & Verified Badge */
        .username-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            justify-content: center;
        }

        .username {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 14px rgba(0, 0, 0, 0.9);
            background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .verified-badge {
            color: #00dfd8;
            font-size: 1.2rem;
            filter: drop-shadow(0 0 10px rgba(0, 223, 216, 0.8));
            animation: bounceSoft 3s ease-in-out infinite;
        }

        @keyframes bounceSoft {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        /* Bio & Location */
        .bio {
            font-size: 0.88rem;
            color: rgba(255, 255, 255, 0.95);
            line-height: 1.45;
            max-width: 400px;
            margin-bottom: 8px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
            font-weight: 400;
        }

        .location {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.75);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: center;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
        }

        /* Guns.lol Style Discord Pill Widget */
        .discord-card {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 10px 20px 10px 12px;
            border-radius: 24px;
            text-decoration: none;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .discord-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: rotate(30deg);
            transition: transform 0.8s ease;
        }

        .discord-card:hover::before {
            transform: rotate(30deg) translate(20%, 20%);
        }

        .discord-card:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.38);
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 16px 45px rgba(0, 223, 216, 0.2);
        }

        .discord-avatar-wrap {
            position: relative;
            width: 42px;
            height: 42px;
        }

        .discord-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .status-dot {
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid #080808;
            background-color: #23a55a;
            box-shadow: 0 0 8px rgba(35, 165, 90, 0.8);
        }

        .status-online { background-color: #23a55a; box-shadow: 0 0 8px rgba(35, 165, 90, 0.8); }
        .status-idle { background-color: #f0b232; box-shadow: 0 0 8px rgba(240, 178, 50, 0.8); }
        .status-dnd { background-color: #f23f43; box-shadow: 0 0 8px rgba(242, 63, 67, 0.8); }
        .status-offline { background-color: #747f8d; }

        .discord-text {
            text-align: left;
        }

        .discord-username {
            font-size: 0.88rem;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.2;
        }

        .discord-status {
            font-size: 0.74rem;
            color: rgba(255, 255, 255, 0.75);
            line-height: 1.2;
        }
    </style>
</head>
<body>

    <!-- Canvas Cursor particle trail -->
    <canvas id="cursorCanvas"></canvas>

    <!-- Click-to-Enter Overlay -->
    <div id="overlay" class="overlay">
        <p>[ click anywhere to enter ]</p>
    </div>

    <!-- Top Left Sound Toggle Button -->
    <div class="top-left-controls">
        <div class="icon-btn icon-btn-square" id="audioToggleBtn" title="Toggle Sound">
            <i class="fa-solid fa-volume-xmark" id="audioIcon"></i>
        </div>
    </div>

    <!-- Top Right Portfolio Button -->
    <div class="top-right-controls">
        <a href="https://arnavjalwekar4-code.github.io/about-me/" target="_blank" class="icon-btn">
            <i class="fa-solid fa-briefcase"></i>
            <span>Portfolio</span>
        </a>
    </div>

    <!-- Bottom Left View Counter -->
    <div class="view-counter">
        <i class="fa-solid fa-eye"></i>
        <span id="visitCount">1,248</span>
    </div>

    <!-- Background Video Tag -->
    <div class="bg-container">
        <video id="bgVideo" autoplay muted loop playsinline class="bg-video">
            <source src="baground.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Main Profile Card Content -->
    <div class="main-wrapper" id="mainWrapper">
        
        <!-- Decorated Profile Avatar -->
        <div class="avatar-wrap">
            <div class="avatar-deco-ring"></div>
            <img src="logo.png" id="mainPfp" alt="Arnav Profile" class="avatar">
        </div>

        <!-- Username & Verified Badge -->
        <div class="username-container">
            <h1 class="username">Arnav</h1>
            <i class="fa-solid fa-circle-check verified-badge" title="Verified"></i>
        </div>

        <p class="bio" id="userBio">just a dev with big dreams ♡ no ego, just code & kindness ☁️</p>

        <div class="location">
            <i class="fa-solid fa-location-dot" style="font-size: 0.72rem; color: #00dfd8;"></i> los angeles vally
        </div>

        <!-- Discord Live Status Card -->
        <a href="https://discord.com/users/1540399501142134847" target="_blank" class="discord-card">
            <div class="discord-avatar-wrap">
                <img src="logo.png" id="discordPfp" alt="Discord Avatar" class="discord-avatar">
                <div class="status-dot status-online" id="discordStatusDot"></div>
            </div>
            <div class="discord-text">
                <div class="discord-username" id="discordTag">arn4v_dev</div>
                <div class="discord-status" id="discordCustomStatus">Online</div>
            </div>
        </a>
    </div>

    <!-- Audio Element for song.mp4 -->
    <audio id="bgSong" loop preload="auto">
        <source src="song.mp4" type="audio/mp4">
    </audio>

    <script>
        const DISCORD_USER_ID = "1540399501142134847";

        document.addEventListener("DOMContentLoaded", () => {
            const overlay = document.getElementById("overlay");
            const bgSong = document.getElementById("bgSong");
            const bgVideo = document.getElementById("bgVideo");
            const audioToggleBtn = document.getElementById("audioToggleBtn");
            const audioIcon = document.getElementById("audioIcon");
            const mainWrapper = document.getElementById("mainWrapper");

            let isPlaying = false;
            bgSong.volume = 0.5;

            // Explicit video play trigger
            const playVideo = () => {
                if (bgVideo) {
                    bgVideo.play().catch(err => console.log("Video waiting for user click", err));
                }
            };
            playVideo();

            // Overlay Click to Enter
            overlay.addEventListener("click", () => {
                overlay.classList.add("hidden");
                mainWrapper.classList.add("visible");
                playVideo();

                bgSong.play().then(() => {
                    isPlaying = true;
                    audioIcon.className = "fa-solid fa-volume-high";
                }).catch(err => {
                    console.log("Audio autoplay exception:", err);
                });
            });

            // Toggle Audio Button
            audioToggleBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                if (isPlaying) {
                    bgSong.pause();
                    isPlaying = false;
                    audioIcon.className = "fa-solid fa-volume-xmark";
                } else {
                    bgSong.play();
                    isPlaying = true;
                    audioIcon.className = "fa-solid fa-volume-high";
                }
            });

            // View Counter Logic
            updateVisitorCounter();

            // Discord Live Lanyard Sync
            fetchDiscordPresence();
            setInterval(fetchDiscordPresence, 8000);

            // Cursor Particles
            initCursorEffect();
        });

        function updateVisitorCounter() {
            let count = localStorage.getItem("site_page_views");
            if (!count) {
                count = 1248;
            } else {
                count = parseInt(count) + 1;
            }
            localStorage.setItem("site_page_views", count);
            document.getElementById("visitCount").textContent = count.toLocaleString();
        }

        async function fetchDiscordPresence() {
            try {
                const response = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_USER_ID}`);
                const resData = await response.json();

                if (!resData.success) return;

                const data = resData.data;

                if (data.discord_user.username) {
                    document.getElementById("discordTag").textContent = data.discord_user.username;
                }

                if (data.discord_user.avatar) {
                    const avatarUrl = `https://cdn.discordapp.com/avatars/${DISCORD_USER_ID}/${data.discord_user.avatar}.png?size=256`;
                    document.getElementById("discordPfp").src = avatarUrl;
                    document.getElementById("mainPfp").src = avatarUrl;
                }

                const statusDot = document.getElementById("discordStatusDot");
                statusDot.className = "status-dot status-" + (data.discord_status || "online");

                const statusText = document.getElementById("discordCustomStatus");
                if (data.custom_status && data.custom_status.state) {
                    statusText.textContent = data.custom_status.state;
                } else if (data.activities && data.activities.length > 0) {
                    const act = data.activities.find(a => a.type !== 4);
                    if (act) {
                        statusText.textContent = `Playing ${act.name}`;
                    } else {
                        statusText.textContent = data.discord_status || "Online";
                    }
                } else {
                    statusText.textContent = data.discord_status === "offline" ? "Offline" : "Online";
                }

            } catch (error) {
                console.log("Lanyard sync notice");
            }
        }

        // Particle Cursor Animation Effect
        function initCursorEffect() {
            const canvas = document.getElementById("cursorCanvas");
            const ctx = canvas.getContext("2d");

            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            window.addEventListener("resize", () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            const particles = [];
            const mouse = { x: width / 2, y: height / 2 };

            window.addEventListener("mousemove", (e) => {
                mouse.x = e.clientX;
                mouse.y = e.clientY;

                for (let i = 0; i < 2; i++) {
                    particles.push(new Particle(mouse.x, mouse.y));
                }
            });

            window.addEventListener("click", (e) => {
                for (let i = 0; i < 18; i++) {
                    particles.push(new Particle(e.clientX, e.clientY, true));
                }
            });

            class Particle {
                constructor(x, y, isBurst = false) {
                    this.x = x;
                    this.y = y;
                    this.size = isBurst ? Math.random() * 4 + 2 : Math.random() * 2.5 + 1;
                    this.speedX = isBurst ? (Math.random() - 0.5) * 7 : (Math.random() - 0.5) * 1.5;
                    this.speedY = isBurst ? (Math.random() - 0.5) * 7 : (Math.random() - 0.5) * 1.5;
                    this.life = 1;
                    this.decay = Math.random() * 0.02 + 0.015;
                    this.color = `hsl(${Math.random() * 60 + 170}, 100%, 70%)`;
                }

                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    this.life -= this.decay;
                }

                draw() {
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = Math.max(0, this.life);
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);

                // Cursor Ring
                ctx.globalAlpha = 0.8;
                ctx.strokeStyle = "rgba(0, 223, 216, 0.8)";
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, 9, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, 2.5, 0, Math.PI * 2);
                ctx.fill();

                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    particles[i].draw();

                    if (particles[i].life <= 0) {
                        particles.splice(i, 1);
                    }
                }

                requestAnimationFrame(animate);
            }

            animate();
        }
    </script>
</body>
</html>
